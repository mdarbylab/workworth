name: CI

# Runs `npm run verify`, the project's one gate script (handbook
# quality-gates.md): secret scan, dependency audit, type-check, lint, tests,
# build. Same command locally and here, on every push to main and every PR.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Third-party actions are pinned to commit SHAs (handbook,
      # quality-gates.md); the comment names the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run verify
